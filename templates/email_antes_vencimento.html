<html>
<body style="font-family: Arial, sans-serif; background-color: #f4f6f8; padding: 20px;">

    <div style="
        max-width: 500px;
        margin: auto;
        background: white;
        border-radius: 10px;
        padding: 20px;
        text-align: center;
    ">

        <h2 style="color: #2f6fed;">
            WebCar
        </h2>

        <p style="color: #333;">
            Sua parcela vence em 2 dias.
        </p>

        <div style="
            background: #2f6fed;
            color: white;
            font-size: 22px;
            font-weight: bold;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        ">

            Parcela {{numero_parcela}}

        </div>



        <p style="color: #555;">
            <strong>Valor:</strong> R$ {{valor_parcela}}
        </p>

        <p style="color: #555;">
            <strong>Data de vencimento:</strong> {{data_vencimento}}
        </p>

        <hr style="margin: 20px 0;">

        <p style="color: #999; font-size: 12px;">
            © 2026 WebCar - Tecnologia e inovação
        </p>

    </div>

</body>
</html>
